# Publica no GitHub Pages os dois sites do repositório:
#   raiz   -> versão antiga, copiada da branch main como está
#   /novo/ -> este site, gerado a partir desta branch
# Roda a cada push nesta branch e manualmente (Actions -> Publicar site -> Run workflow).
# Obs.: o agendamento (schedule) do GitHub só roda na branch padrão (main); enquanto este
# site estiver fora da main, as notícias do Instagram atualizam a cada push ou execução manual.
name: Publicar site

on:
  push:
    branches: [site-v2]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar notícias do Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/instagram.js

      - name: Salvar notícias novas no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dados/noticias.json public/img/noticias || true
          git diff --cached --quiet || (git commit -m "Atualiza notícias do Instagram [skip ci]" && git push)

      - name: Gerar o site
        run: node scripts/build.js

      - name: Buscar a versão antiga (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: antigo

      - name: Montar o pacote (antigo na raiz, novo em /novo/)
        run: |
          mkdir -p _site
          rsync -a --exclude .git antigo/ _site/
          mkdir -p _site/novo
          cp -r dist/. _site/novo/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
